<!DOCTYPE html>
<html lang="zh-TW" class="bg-[#0a0a0a]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>快樂49忘年會座位分布圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 確保全域與超出邊界區域皆為黑底 */
        html, body {
            background-color: #0a0a0a;
            color: #d4af37;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            /* 針對 iOS 橡皮筋效應的留白修復 */
            overscroll-behavior-y: none; 
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .gold-text {
            background: linear-gradient(to bottom, #f9f295, #e0aa3e, #b8860b, #e0aa3e, #f9f295);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        /* 圓桌樣式 */
        .table-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2a2a2a 0%, #000000 100%);
            border: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(212, 175, 55, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            padding: 8px;
            flex-shrink: 0;
            scroll-margin-top: 150px; 
        }

        .table-circle:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
            z-index: 50;
            border-color: #f9f295;
        }

        /* VIP 桌 */
        .table-vip {
            border: 3px solid #f9f295;
            box-shadow: 0 0 20px rgba(249, 242, 149, 0.3);
            background: radial-gradient(circle, #4d4126 0%, #1a1500 100%);
        }

        /* 攝影器材 */
        .camera-box {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e3a8a 0%, #000000 100%);
            border: 2px solid #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #93c5fd;
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(30, 64, 175, 0.6);
            letter-spacing: 0.2em;
        }

        /* 燈光音響長方形 */
        .light-box-rect {
            background: linear-gradient(135deg, #44403c 0%, #000000 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            height: 85px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
            letter-spacing: 0.2em;
        }

        /* 搜尋命中 */
        .highlight-pulse {
            animation: pulse-gold 1.5s infinite;
            border-color: #ffffff !important;
            transform: scale(1.25);
            z-index: 60;
        }
        
        /* 當前捲動聚焦的目標 */
        .currently-focused {
            outline: 4px solid white;
            outline-offset: 4px;
            z-index: 70;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.8); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* 紅毯走道 */
        .aisle {
            background: linear-gradient(to bottom, transparent, rgba(153, 27, 27, 0.2), transparent);
            width: 60px;
            min-width: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            writing-mode: vertical-rl;
            letter-spacing: 1.2em;
            color: #991b1b;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* 網格系統 */
        .seating-grid {
            display: grid;
            grid-template-columns: repeat(4, 85px);
            gap: 15px;
            align-content: start;
        }

        .search-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(12px);
            padding: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* 行動版捲動修正 */
        .scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 30px 40px; 
        }
        
        .layout-container {
            width: max-content;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0 auto;
        }

        .empty-slot { width: 85px; height: 85px; }
    </style>
</head>
<body>

    <div class="search-container text-center">
        <h1 class="text-2xl md:text-3xl font-bold gold-text mb-3 tracking-[0.2em] md:tracking-[0.3em]">快樂49忘年會座位分布圖</h1>
        <div class="relative max-w-lg mx-auto">
            <input type="text" id="searchInput" placeholder="搜尋分店、人名關鍵字或桌號" 
                class="w-full bg-zinc-900 border border-amber-600/30 rounded-full py-2.5 px-6 text-amber-100 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all shadow-xl text-sm">
            <span class="absolute right-5 top-2.5 text-amber-600/50 text-lg">🔍</span>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-2 md:p-4 flex flex-col items-center">
        
        <div class="w-full text-center py-6 mb-4 border-b border-amber-900/20">
            <span class="text-xl md:text-2xl font-thin tracking-[1.5em] text-amber-900/60 ml-[1.5em]">主舞台 STAGE</span>
        </div>

        <div id="mainScrollWrapper" class="scroll-wrapper">
            <div class="layout-container">
                <!-- 左側區域 -->
                <div id="leftArea" class="seating-grid"></div>

                <!-- 中央紅毯 -->
                <div class="aisle mx-12 self-stretch">
                    紅 毯 走 道
                </div>

                <!-- 右側區域 -->
                <div id="rightArea" class="seating-grid"></div>
            </div>
        </div>

        <div class="mt-20 mb-12 text-center text-amber-900/30 text-[10px] tracking-[0.4em] uppercase">
            Designed By ZOSS Tech
        </div>
    </div>

    <script>
        const leftTables = [
            // Row 1 & 2: 1桌與8桌左側留空
            { type: 'empty' }, { id: 1, name: '大里 5 / 精明一 4 / 精誠 1' }, { id: 2, name: '精誠 10' }, { id: 3, name: 'VIP (1素)', isVIP: true, veg: 1 },
            { type: 'empty' }, { id: 8, name: '大里 10' }, { id: 9, name: '藝文 8 (3兒童座椅)', kid: true }, { id: 10, name: 'VIP', isVIP: true },
            // Row 3: 15桌有兒童座椅
            { id: 15, name: '大里2 10 (1兒童座椅)', kid: true }, { id: 16, name: '文心 10' }, { type: 'camera' }, { id: 17, name: 'VIP', isVIP: true },
            { id: 22, name: '興祥 10' }, { id: 23, name: '市政 3 (1素) / 漢口 7 (1素)', veg: 2 }, { id: 24, name: '太平 10 (8+2)' }, { id: 25, name: '西湖 7 / 正義 3' },
            { id: 30, name: '尊爵 6 / 興祥 4' }, { id: 31, name: '市政 10 (2素)', veg: 2 }, { id: 32, name: '大直 10' }, { id: 33, name: '天母 4 / 北投 6' },
            { id: 38, name: '員林 7 / 豐原 1 / 豐原2 1 / 豐原3 1' }, { id: 39, name: '豐原2 10' }, { id: 40, name: '天母 10' }, { id: 41, name: '北投 10 (1兒童座椅)', kid: true },
            // Row 7: 燈光音響長方形靠走道
            { id: 46, name: '豐原 10' }, { id: 47, name: '豐原3 10' }, { type: 'light-rect' },
            // 下半部
            { id: 48, name: '市府 6 / 松山 4' }, { id: 49, name: '市府 10' }, { id: 50, name: '樂群館 10' }, { id: 51, name: '宜蘭 10 (1素)', veg: 1 },
            { id: 56, name: '府中 10' }, { id: 57, name: '府中 10' }, { id: 58, name: '永吉 10' }, { id: 59, name: '樂群館 3 / 永吉 7' },
            { id: 64, name: '北屯 10' }, { id: 65, name: '北屯 3 / 北平 4 / 大墩 3' }, { id: 66, name: '大墩 1 / 中科 9 (1素)', veg: 1 }, { id: 67, name: '崇德 10' },
            { id: 71, name: '大墩 10' }, { id: 72, name: '北平 10' }, { id: 73, name: '延和 10' }, { id: 74, name: '中央 10' },
            { id: 79, name: '北大學城 10 (1素)', veg: 1 }, { id: 80, name: '裕民 10' }, { id: 81, name: '泰山 10' }, { id: 82, name: '板橋 10' }
        ];

        const rightTables = [
            { id: 4, name: 'VIP', isVIP: true }, { id: 5, name: '憶璇 10 (2素)', veg: 2 }, { id: 6, name: '憶璇 5 / 雙和 5' }, { id: 7, name: '木柵 2 / 新莊 8 (1素)', veg: 1 },
            { id: 11, name: 'VIP', isVIP: true }, { id: 12, name: '育德 10' }, { id: 13, name: '雙和 10' }, { id: 14, name: '木柵 10' },
            { id: 18, name: 'VIP', isVIP: true }, { id: 19, name: '育德 6 / 林口 4' }, { id: 20, name: '雙和 1 / 永樂 9' }, { id: 21, name: '中正 10' },
            { id: 26, name: 'VIP', isVIP: true }, { id: 27, name: 'VIP', isVIP: true }, { id: 28, name: '東湖 10 (1素)', veg: 1 }, { id: 29, name: '中正 10 (1素)', veg: 1 },
            { id: 34, name: 'VIP', isVIP: true }, { id: 35, name: 'VIP', isVIP: true }, { id: 36, name: '東湖 10' }, { id: 37, name: '文華 10' },
            { id: 42, name: '伊通 10' }, { id: 43, name: '雙城 10' }, { id: 44, name: '民生 10' }, { id: 45, name: '民生 10' },
            // Row 7: 燈光音響長方形靠走道，其右側無桌位
            { type: 'light-rect' }, { type: 'empty' }, { type: 'empty' },
            { id: 52, name: '埔墘 10' }, { id: 53, name: '埔墘 10' }, { id: 54, name: '埔墘 10' }, { id: 55, name: '樹林 10 (1素)', veg: 1 },
            { id: 60, name: '漢克娜娜 10' }, { id: 61, name: '漢克娜娜 3 / 竹北 7' }, { id: 62, name: '中山 5 / 新竹 5' }, { id: 63, name: '板林 10' },
            { type: 'camera' }, { id: 68, name: '竹北 10' }, { id: 69, name: '友愛 10' }, { id: 70, name: '友愛 10' },
            { id: 75, name: '青年 10' }, { id: 76, name: '嘉義 10' }, { id: 77, name: '屏東 10 (1素)', veg: 1 }, { id: 78, name: '鳳玲 7 / 屏東 3' },
            { id: 83, name: '興業 4 / 青年 6' }, { id: 84, name: '興業 10' }, { id: 85, name: '屏東 3 / 嘉義 2 / 五福 5' }, { id: 86, name: '鳳玲 10' },
            { id: 87, name: '新天地 10' }, { id: 88, name: '南紡 10' }, { id: 89, name: '陽明 10' }, { id: 90, name: '五福 10' }
        ];

        let cycleInterval = null;
        let matchedElements = [];
        let currentCycleIndex = 0;

        function getAllUrlParams(url) {
          var queryString = url ? url.split('?')[1] : window.location.search.slice(1);
          var obj = {};
          if (queryString) {
            queryString = queryString.split('#')[0];
            var arr = queryString.split('&');
            for (var i = 0; i < arr.length; i++) {
              var a = arr[i].split('=');
              var paramName = a[0];
              var paramValue = typeof(a[1]) === 'undefined' ? true : a[1];
              if (paramName.match(/\[(\d+)?\]$/)) {
                var key = paramName.replace(/\[(\d+)?\]/, '');
                if (!obj[key]) obj[key] = [];
                if (paramName.match(/\[\d+\]$/)) {
                  var index = /\[(\d+)\]/.exec(paramName)[1];
                  obj[key][index] = paramValue;
                } else {
                  obj[key].push(paramValue);
                }
              } else {
                if (!obj[paramName]) {
                  obj[paramName] = paramValue;
                } else if (obj[paramName] && typeof obj[paramName] === 'string') {
                  obj[paramName] = [obj[paramName]];
                  obj[paramName].push(paramValue);
                } else {
                  obj[paramName].push(paramValue);
                }
              }
            }
          }
          return obj;
        }

        function stopAutoCycle() {
            if (cycleInterval) {
                clearInterval(cycleInterval);
                cycleInterval = null;
                matchedElements.forEach(el => el.classList.remove('currently-focused'));
            }
        }

        function startAutoCycle(elements) {
            stopAutoCycle();
            if (elements.length <= 1) return;
            matchedElements = elements;
            currentCycleIndex = 0;
            scrollToTarget(matchedElements[currentCycleIndex]);
            cycleInterval = setInterval(() => {
                currentCycleIndex = (currentCycleIndex + 1) % matchedElements.length;
                scrollToTarget(matchedElements[currentCycleIndex]);
            }, 3000);
        }

        function scrollToTarget(targetEl) {
            if (!targetEl) return;
            matchedElements.forEach(el => el.classList.remove('currently-focused'));
            targetEl.classList.add('currently-focused');
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const wrapper = document.getElementById('mainScrollWrapper');
            const rect = targetEl.getBoundingClientRect();
            const wrapperRect = wrapper.getBoundingClientRect();
            const scrollLeft = wrapper.scrollLeft + rect.left - (wrapperRect.width / 2) + (rect.width / 2);
            wrapper.scrollTo({ left: scrollLeft, behavior: 'smooth' });
        }

        const userActivityEvents = ['mousedown', 'mousemove', 'touchstart', 'wheel', 'keydown'];
        userActivityEvents.forEach(eventType => {
            window.addEventListener(eventType, () => {
                if (cycleInterval) stopAutoCycle();
            }, { passive: true });
        });

        function createEl(data) {
            if (data.type === 'empty') return `<div class="empty-slot"></div>`;
            if (data.type === 'camera') return `<div class="camera-box">攝影<br>器材</div>`;
            if (data.type === 'light-rect') return `<div class="light-box-rect col-span-2">燈光音響</div>`;
            const vegHtml = data.veg ? `<span class="absolute -right-1 -top-1 text-[11px] bg-black/80 rounded-full px-1 shadow-sm">🌿</span>` : '';
            const kidHtml = data.kid ? `<span class="absolute -left-1 -top-1 text-[11px] bg-black/80 rounded-full px-1 shadow-sm">👶</span>` : '';
            const vipClass = data.isVIP ? 'table-vip' : '';
            return `
                <div class="table-circle ${vipClass}" data-name="${data.name}" data-id="${data.id}">
                    <span class="text-3xl font-bold gold-text">${data.id}</span>
                    <div class="text-[10px] text-zinc-300 mt-0.5 leading-[1.1] text-center w-full px-1 overflow-visible break-words">
                        ${data.name}
                    </div>
                    ${vegHtml}
                    ${kidHtml}
                </div>
            `;
        }

        function performSearch(keyword, shouldScroll = true) {
            const val = keyword.toLowerCase().trim();
            const allTables = document.querySelectorAll('.table-circle');
            let matches = [];
            allTables.forEach(el => {
                const name = el.getAttribute('data-name').toLowerCase();
                const id = el.getAttribute('data-id');
                const isTableNumber = /^\d+$/.test(val);
                const matched = isTableNumber ? Number(id) === Number(val) : name.includes(val);
                if (val !== "" && matched) {
                    el.classList.add('highlight-pulse');
                    matches.push(el);
                } else {
                    el.classList.remove('highlight-pulse');
                    el.classList.remove('currently-focused');
                }
            });
            if (shouldScroll && matches.length > 0) {
                if (matches.length === 1) {
                    stopAutoCycle();
                    scrollToTarget(matches[0]);
                } else {
                    startAutoCycle(matches);
                }
            } else {
                stopAutoCycle();
            }
        }

        function render() {
            document.getElementById('leftArea').innerHTML = leftTables.map(createEl).join('');
            document.getElementById('rightArea').innerHTML = rightTables.map(createEl).join('');
            
            setTimeout(() => {
                const urlParams = new URLSearchParams(window.location.search);
                var queryParam;
                if (urlParams.has("liff.state")) {
                    var tmp = getAllUrlParams(decodeURIComponent(urlParams.get("liff.state")));
                    queryParam = tmp.q;
                } else {
                    queryParam = urlParams.get('q');
                }
                if (['快樂總部', '營運中心'].includes(queryParam)) {
                    queryParam = 'VIP';
                }
                if (['嘉義G'].includes(queryParam)) {
                    queryParam = '友愛';
                }
                if (queryParam) {
                    const searchInput = document.getElementById('searchInput');
                    searchInput.value = queryParam;
                    performSearch(queryParam, true);
                }
            }, 500);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            performSearch(e.target.value, true);
        });

        window.onload = render;
    </script>
</body>
</html>
