<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團購業績管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #22c55e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 relative">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl mb-6">
    <div class="p-6 border-b-4 border-green-500">
      <div class="uppercase tracking-wide text-sm text-green-600 font-semibold mb-1">團購業績管理系統</div>
      <p class="block mt-1 text-lg leading-tight font-medium text-black">管理員專用後台</p>
    </div>
  </div>

  <!-- 載入中畫面 -->
  <div id="loading" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 flex flex-col items-center justify-center">
    <div id="spinner" class="loader mb-4"></div>
    <div id="loadingText" class="text-gray-600 w-full text-center">正在初始化系統...</div>
    <p id="errorMsg" class="text-red-500 text-sm mt-4 font-bold text-center whitespace-pre-line"></p>
  </div>

  <!-- 主要內容區 -->
  <div id="mainContent" class="max-w-md mx-auto hidden space-y-4">
    <!-- 管理員資訊 -->
    <div class="bg-white rounded-xl shadow-md p-4 flex items-center space-x-4">
      <img id="userPicture" class="w-12 h-12 rounded-full border border-gray-200" src="" alt="User Avatar">
      <div>
        <p id="userName" class="text-gray-900 font-bold"></p>
        <p class="text-gray-500 text-xs">系統管理員</p>
      </div>
    </div>
    <!-- 團主清單容器 -->
    <div id="kolListContainer" class="space-y-4"></div>
  </div>

  <!-- 【新增】專屬分享確認彈窗 (解決電腦版瀏覽器阻擋彈出視窗的問題) -->
  <div id="shareModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 p-4 items-center justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center transform transition-all">
      <h3 id="shareModalTitle" class="text-xl font-bold mb-3 text-gray-800">準備就緒</h3>
      <p id="shareModalDesc" class="text-gray-600 text-sm mb-6 leading-relaxed">
        為避免瀏覽器阻擋，請點擊下方按鈕手動開啟好友選單。
      </p>
      <div class="flex flex-col space-y-3">
        <button id="executeShareBtn" class="w-full py-3 bg-green-500 hover:bg-green-600 rounded-xl text-white font-bold text-lg shadow-md transition duration-150">
          🚀 開啟 LINE 好友選單
        </button>
        <button onclick="closeShareModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 rounded-xl text-gray-700 font-bold transition duration-150">
          返回 / 取消
        </button>
      </div>
    </div>
  </div>

  <script>
    // ======================================================================
    // 動態變數：將透過網址參數讀取
    // ======================================================================
    let MY_LIFF_ID = ''; 
    let GAS_API_URL = ''; 

    // 分享彈窗的全域變數
    let currentShareMessages = [];
    let reloadAfterShare = false;

    document.addEventListener("DOMContentLoaded", function() {
      let params = new URL(document.location.toString()).searchParams;
      
      if (params.has("liffRedirectUri")) {
          params = new URL(decodeURIComponent(params.get("liffRedirectUri"))).searchParams;
      }

      if (!params.has("liff") || !params.has("sid")) {
          showError("系統錯誤：無效的連結參數\n\n請確認網址是否包含 liff 與 sid 參數。\n範例：?liff=您的ID&sid=您的GAS_ID");
          return;
      }

      MY_LIFF_ID = params.get("liff");
      GAS_API_URL = `https://script.google.com/macros/s/${params.get("sid")}/exec`;

      initializeLiff();
    });

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loadingText').innerText = '系統發生錯誤';
      document.getElementById('loadingText').classList.add('text-red-600');
      document.getElementById('errorMsg').innerText = msg;
    }

    // 核心 API 呼叫模組
    async function callGasApi(action, params = {}) {
      try {
        const url = new URL(GAS_API_URL);
        url.searchParams.append('action', action);
        Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));

        const response = await fetch(url.toString(), { method: 'GET' });
        return await response.json();
      } catch (error) {
        throw new Error("與資料庫連線失敗: " + error.message);
      }
    }

    async function initializeLiff() {
      try {
        document.getElementById('loadingText').innerText = '正在連線 LINE 伺服器...';
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          document.getElementById('loadingText').innerText = '正在讀取試算表資料...';
          const profile = await liff.getProfile();
          
          const response = await callGasApi('getAdminData', { uid: profile.userId });
          
          if (response.success) {
            renderMainContent(profile, response.data);
          } else {
            showError("身分驗證失敗：" + response.message + "\n您的 UID: " + profile.userId);
          }
        }
      } catch (err) {
        showError("LIFF 初始化錯誤：" + err.message);
      }
    }

    function renderMainContent(profile, kolData) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      
      document.getElementById('userName').innerText = profile.displayName;
      if (profile.pictureUrl) document.getElementById('userPicture').src = profile.pictureUrl;

      const container = document.getElementById('kolListContainer');
      container.innerHTML = '';

      kolData.forEach(kol => {
        const isBound = kol.uid !== "";
        const statusBadge = isBound 
          ? `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">已綁定</span>`
          : `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">未綁定</span>`;

        let actionButtons = `<button onclick="shareSales('${kol.name}')" class="mt-3 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded shadow transition duration-150">轉傳業績報表</button>`;
        
        if (!isBound) {
          actionButtons += `<button onclick="generatePassCode('${kol.name}')" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded shadow transition duration-150">產生 / 轉傳綁定邀請卡</button>`;
        }

        const card = `
          <div class="bg-white rounded-xl shadow p-5 border border-gray-100">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold text-gray-800 text-lg">${kol.name}</h3>
              ${statusBadge}
            </div>
            ${isBound ? `<p class="text-xs text-gray-400 mb-1">UID: ${kol.uid.substring(0,8)}...</p>` : ''}
            ${kol.passCode && !isBound ? `<div class="bg-red-50 p-2 rounded mt-2 text-sm text-red-600 border border-red-100">請團主在機器人輸入：<br><span class="font-bold text-lg cursor-pointer" onclick="alert('已複製綁定指令'); navigator.clipboard.writeText('綁定 ${kol.passCode}');">綁定 ${kol.passCode}</span></div>` : ''}
            ${actionButtons}
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // ======================================================================
    // UI 控制：分享彈窗邏輯 (Bypass 瀏覽器 Popup Blocker)
    // ======================================================================
    function openShareModal(title, desc, messages, reload = false) {
      document.getElementById('shareModalTitle').innerText = title;
      document.getElementById('shareModalDesc').innerHTML = desc;
      currentShareMessages = messages;
      reloadAfterShare = reload;
      
      const modal = document.getElementById('shareModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeShareModal() {
      const modal = document.getElementById('shareModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      if (reloadAfterShare) location.reload();
    }

    // 當使用者「手動點擊」分享按鈕時，才執行 ShareTargetPicker
    document.getElementById('executeShareBtn').addEventListener('click', async function() {
      const modal = document.getElementById('shareModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      
      try {
        if (liff.isApiAvailable('shareTargetPicker')) {
          await liff.shareTargetPicker(currentShareMessages);
        } else {
          alert("您的裝置或瀏覽器不支援 Share Target Picker 功能\n(請確認在 LINE Developers 後台已開啟此功能)");
        }
      } catch(err) {
        if(err.message.indexOf("canceled") === -1) {
          console.error("Share Target Picker 錯誤:", err);
        }
      } finally {
        if (reloadAfterShare) location.reload();
      }
    });
    // ======================================================================

    async function generatePassCode(kolName) {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('loadingText').innerText = '正在產生專屬綁定碼與邀請卡...';
      document.getElementById('spinner').style.display = 'block';

      try {
        const res = await callGasApi('createPassCode', { kolName: kolName });
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');

        if (res.success) {
          // 不再使用 confirm()，改用我們自建的 Modal 來引導使用者點擊
          openShareModal(
            '✅ 綁定碼產生成功！', 
            `已為【${kolName}】建立專屬邀請卡。<br><br><span class="text-xs text-gray-500">由於瀏覽器安全限制，請點擊下方按鈕以開啟好友分享選單。</span>`,
            [res.flexMessage],
            true
          );
        } else {
          showError("產生失敗: " + res.message);
        }
      } catch(err) {
        showError(err.message);
      }
    }

    async function shareSales(kolName) {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('loadingText').innerText = '正在計算業績與生成報表...';
      document.getElementById('spinner').style.display = 'block';

      try {
        const res = await callGasApi('getSalesFlexMessageForLiff', { kolName: kolName });
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        
        if (!res.success) {
          alert("錯誤: " + res.message);
          return;
        }

        // 不再直接呼叫 shareTargetPicker，改用 Modal
        openShareModal(
          '📊 報表生成完畢', 
          `【${kolName}】的業績報表已準備就緒。<br><br><span class="text-xs text-gray-500">由於瀏覽器安全限制，請點擊下方按鈕以開啟好友分享選單。</span>`,
          [res.flexMessage],
          false
        );

      } catch(err) {
        showError("獲取業績失敗: " + err.message);
      }
    }
  </script>
</body>
</html>
