<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>忘年會・我的領獎碼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151515;color:#f9efd8;font-family:system-ui,sans-serif;padding:28px 16px}main{max-width:480px;margin:auto}h1{font-size:26px;margin:8px 0}header{margin-bottom:24px}.subtitle{color:#d6b66b;font-size:14px;letter-spacing:2px}.muted{color:#bdb5a6;font-size:14px;line-height:1.6}button{font:inherit;border:0;border-radius:12px;background:#806426;color:white;padding:14px 20px;cursor:pointer;width:100%}button:disabled{opacity:.5;cursor:default}.card-body{background:white;color:#252525;border-radius:18px;padding:24px;margin:16px 0;text-align:center}.award-title{font-size:22px;margin-bottom:8px;font-weight:700}.status{font-size:20px;font-weight:700;margin:18px 0}.qr{display:inline-block;padding:20px;background:white;max-width:100%}.qr img,.qr canvas{max-width:100%;height:auto}.note{font-size:14px;color:#666;line-height:1.6}.redeemed{color:#247245}#loading{text-align:center;padding:18px 0}#spinner{display:inline-block;width:24px;height:24px;border:3px solid #76613b;border-top-color:#f9efd8;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head><body><main>
<header><div class="subtitle">忘年會・領獎服務</div><h1>我的領獎碼</h1><div class="muted"><span id="group"></span> <span id="shop"></span></div></header>
<div id="loading" role="status" aria-live="polite"><div id="spinner"></div><p id="mask">確認身分與核銷狀態中…</p></div>
<section id="prizes" aria-live="polite"></section>
<button id="refresh" type="button" onclick="refreshPrizes()">重新確認核銷狀態</button>
<p class="muted">領獎碼只供本人使用，請勿轉傳。出示畫面不代表已領取；以工作人員核銷確認為準。</p>
</main><script>
var params=new URL(document.location.toString()).searchParams;
if(params.has('liffRedirectUri'))params=new URL(params.get('liffRedirectUri')).searchParams;
var liffId=params.get('liff'),sid=params.get('sid');
var url='https://script.google.com/macros/s/'+encodeURIComponent(sid||'')+'/exec';
var loginPromise,requestVersion=0,refreshTimer;
function withTimeout(promise,ms){var timer;return Promise.race([promise,new Promise(function(_,reject){timer=setTimeout(function(){reject(new Error('Timeout'));},ms);})]).finally(function(){clearTimeout(timer);});}
async function getToken(id){
 if(!id||!sid)throw new Error('MissingParameters');
 if(!loginPromise)loginPromise=withTimeout(liff.init({liffId:id,withLoginOnExternalBrowser:true}),20000).catch(function(e){loginPromise=null;throw e;});
 await loginPromise;
 var accessToken=liff.getAccessToken();
 if(!accessToken)throw new Error('LoginRequired');
 return {accessToken:accessToken};
}
async function sendPost(target,body){
 var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},20000);
 try{var response=await fetch(target,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),cache:'no-store',signal:controller.signal});
 if(!response.ok)throw new Error('RequestFailed');return await response.json();
 }finally{clearTimeout(timer);}
}
function textNode(tag,text,cls){var el=document.createElement(tag);el.textContent=String(text);if(cls)el.className=cls;return el;}
function add_prize(prize,type){
 var card=document.createElement('article');card.className='card-body';
 card.appendChild(textNode('div',prize.name,'award-title'));card.appendChild(textNode('div','紅包編號：'+prize.no));
 if(prize.redeem){card.appendChild(textNode('div','已核銷','status redeemed'));card.appendChild(textNode('p','此獎項已完成核銷，不能重複領取。','note'));}
 else if(prize.qrMode===true){
  if(typeof prize.qr==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(prize.qr)){
   card.appendChild(textNode('div','未核銷・請出示 QR Code','status'));
   var box=document.createElement('div');box.className='qr';box.setAttribute('aria-label','本獎項領獎 QR Code');card.appendChild(box);
   new QRCode(box,{text:prize.qr,width:224,height:224,correctLevel:QRCode.CorrectLevel.M});
   card.appendChild(textNode('p','請向領獎處出示此碼。工作人員確認核銷完成後，再領取獎品。','note'));
  }else card.appendChild(textNode('p','暫無有效領獎碼，請洽工作人員。','status'));
 }else{
  var button=textNode('button','掃碼核銷');button.type='button';button.onclick=function(){legacyRedeem(type,prize.no);};card.appendChild(button);
 }
 document.getElementById('prizes').appendChild(card);
}
async function legacyRedeem(type,no){
 if(!window.confirm('即將開啟掃碼核銷，請在領獎處操作。'))return;
 try{var auth=await getToken(liffId),sn=await liff.scanCodeV2();if(!sn.value)return;
 var result=await sendPost(url+'?role=prize_redeem',Object.assign({sn:sn.value.replace(/\n/g,''),type:type,prize_no:no},auth));
 window.alert(result.result==='OK'?'核銷完成':result.result==='Redeemed'?'已核銷':'核銷未完成，請洽工作人員。');
 }catch(e){window.alert('無法確認核銷結果，請洽工作人員，勿重複操作。');}await refreshPrizes();
}
async function refreshPrizes(){
 var version=++requestVersion;clearTimeout(refreshTimer);
 document.getElementById('prizes').replaceChildren();
 document.getElementById('loading').style.display='block';document.getElementById('spinner').style.display='inline-block';
 document.getElementById('mask').textContent='確認身分與核銷狀態中…';document.getElementById('refresh').disabled=true;
 try{
  var auth=await getToken(liffId),response=await sendPost(url+'?role=prize_check',auth);
  if(version!==requestVersion||document.hidden)return;
  if(response.result==='NoPrize'){document.getElementById('mask').textContent='查無您的中獎紀錄，請確認使用中獎者的 LINE 帳號。';return;}
  if(response.result!=='OK')throw new Error('QueryFailed');
  document.getElementById('group').textContent=response.group||'';document.getElementById('shop').textContent=response.shop||'';
  if(response.qrMode===true&&Array.isArray(response.awards))response.awards.forEach(function(p){add_prize(p,p.type);});
  else{['prize','special','entire'].forEach(function(t){if(response[t])add_prize(response[t],t);});(response.lottery||[]).forEach(function(p){add_prize(p,'lottery');});}
  document.getElementById('loading').style.display='none';
 }catch(e){if(version!==requestVersion)return;document.getElementById('prizes').replaceChildren();document.getElementById('mask').textContent='無法確認領獎狀態，已隱藏 QR Code。請重新整理或稍後再試。';
 }finally{if(version===requestVersion){document.getElementById('spinner').style.display='none';document.getElementById('refresh').disabled=false;if(!document.hidden)refreshTimer=setTimeout(refreshPrizes,30000);}}
}
document.addEventListener('visibilitychange',function(){if(document.hidden){++requestVersion;clearTimeout(refreshTimer);document.getElementById('prizes').replaceChildren();}else refreshPrizes();});
window.onload=refreshPrizes;
</script></body></html>
